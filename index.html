<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffc6dd">
  <title>Cake Dash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-pill" id="hudScore"><span class="ico">🍰</span><span id="scoreVal">0</span></div>
      <div class="hud-center">
        <div class="hud-level" id="hudLevel">LEVEL 1</div>
        <div id="hudProgress"></div>
      </div>
      <div class="hud-right">
        <div class="hud-pill small" id="hudBerries"><span class="ico">🍓</span><span id="berryVal">0</span></div>
        <button class="icon-btn" id="hudMute" aria-label="Sound on/off">🔊</button>
      </div>
    </div>

    <!-- Main menu -->
    <div id="menu" class="overlay">
      <h1 class="title" aria-label="Cake Dash">
        <span class="row"><span>C</span><span>A</span><span>K</span><span>E</span></span>
        <span class="row"><span>D</span><span>A</span><span>S</span><span>H</span></span>
      </h1>
      <div class="points-pill" id="menuPoints">⭐ 0 points</div>
      <div class="menu-spacer"></div>
      <div class="levels">
        <button class="btn level" id="btnL1"><b>1</b><small>Fly forever</small></button>
        <button class="btn level run" id="btnL2"><b>2</b><small>Run &amp; jump</small></button>
      </div>
      <div class="menu-row">
        <button class="btn small pink" id="btnShop">🎂 Cakes<span class="shop-badge hidden" id="shopBadge">NEW</span></button>
        <button class="icon-btn big-icon" id="btnSound" aria-label="Sound on/off">🔊</button>
      </div>
      <div class="best" id="menuBest"></div>
    </div>

    <!-- Character shop -->
    <div id="shop" class="overlay hidden dim">
      <div class="shop-panel">
        <div class="shop-head">
          <div class="shop-title">Cakes</div>
          <div class="points-pill" id="shopPoints">⭐ 0</div>
        </div>
        <div class="shop-sub">Earn points by flying, running and catching strawberries.</div>
        <div class="shop-grid" id="shopGrid"></div>
        <button class="btn small lav" id="btnShopBack">⌂ BACK</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="gameOver" class="overlay hidden dim">
      <div class="card">
        <div class="card-emoji">🍰💫</div>
        <div class="card-title">Oopsie!</div>
        <div class="card-score">Score <b id="goScore">0</b></div>
        <div class="card-points" id="goBestPts"></div>
        <div class="card-best" id="goBest"></div>
        <div class="card-unlock hidden" id="goBestUnlock"></div>
        <button class="btn big pink" id="btnRetry">↻ RETRY</button>
        <div class="card-row">
          <button class="btn small lav" id="btnMenu1">⌂ MENU</button>
          <button class="btn small mint" id="btnShop1">🎂 CAKES</button>
        </div>
      </div>
    </div>

    <!-- Victory -->
    <div id="victory" class="overlay hidden dim">
      <div class="card">
        <div class="card-emoji">🏆🍓</div>
        <div class="card-title">YOU DID IT!</div>
        <div class="stars"><span>★</span><span>★</span><span>★</span></div>
        <div class="card-score">Score <b id="vScore">0</b></div>
        <div class="card-points" id="vBestPts"></div>
        <div class="card-best" id="vBest"></div>
        <div class="card-unlock hidden" id="vBestUnlock"></div>
        <button class="btn big pink" id="btnAgain">↻ RUN AGAIN</button>
        <div class="card-row">
          <button class="btn small lav" id="btnMenu2">⌂ MENU</button>
          <button class="btn small mint" id="btnShop2">🎂 CAKES</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- Pause -->
    <div id="paused" class="overlay hidden dim">
      <div class="card">
        <div class="card-emoji">⏸️</div>
        <div class="card-title">Paused</div>
        <button class="btn big pink" id="btnResume">▶ KEEP PLAYING</button>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/cake.js"></script>
  <script src="js/background.js"></script>
  <script src="js/level1.js"></script>
  <script src="js/level2.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
